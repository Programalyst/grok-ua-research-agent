[project]
name = "game-launch-monitor"
version = "0.1.0"
description = "Game Launch Monitor API"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow==13.0.0",
    "pydantic-settings>=2.16.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
